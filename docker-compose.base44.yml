services:
  web:
    image: node:22
    working_dir: /app
    command:
      [
        "sh",
        "-ec",
        "CI=true npm install --no-package-lock --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 8080",
      ]
    ports:
      - "3000:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  node_modules:
