services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      # Bind mounts on Linux sometimes miss inotify events for Vite's watcher.
      - CHOKIDAR_USEPOLLING=true
      # Vite >= 6.1 appends this to server.allowedHosts at runtime.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e 'fetch(\"http://localhost:3000/\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

volumes:
  node_modules:
