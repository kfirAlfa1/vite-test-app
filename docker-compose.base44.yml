services:
  web:
    image: node:22-bookworm
    working_dir: /app
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    command:
      [
        "sh",
        "-ec",
        "npm install --no-audit --no-fund && exec npm run dev -- --host 0.0.0.0 --port 8080",
      ]
    ports:
      - "3000:8080"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s

volumes:
  web_node_modules:
